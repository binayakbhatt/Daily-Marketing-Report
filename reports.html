<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7F1118">
  <title>View Submitted Reports | India Post</title>

  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase & Export Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <!-- SheetJS for true Excel (.xlsx) export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <script src="./reports.js" defer></script>
</head>

<body class="bg-gray-50 text-gray-800">
  <header class="top-header">
    <div class="header-inner flex justify-between items-center w-full">
      <div class="flex items-center gap-4">
        <div class="brand-mark" aria-hidden="true">
          <i data-lucide="database"></i>
        </div>
        <div>
          <p class="brand-overline">DHEMAJI SUB DIVISION</p>
          <h1>Submitted Reports</h1>
          <p class="header-subtitle">Marketing Activity Database</p>
        </div>
      </div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/30 text-white rounded-xl text-xs font-bold tracking-wide transition-all shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Entry Form
      </a>
    </div>
  </header>

  <main class="w-full max-w-7xl mx-auto mt-8 px-4 sm:px-6 lg:px-8 pb-12">
    <!-- Action Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Recent Submissions</h2>
        <p class="text-sm text-gray-500 mt-1" id="recordCount">Loading records...</p>
      </div>
      
      <div class="flex flex-wrap gap-3">
        <button id="exportExcelBtn" class="inline-flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors disabled:opacity-50">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
          Download Excel
        </button>
        <button id="exportPdfBtn" class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#D71920] hover:bg-[#7F1118] text-white text-sm font-semibold rounded-lg shadow-sm transition-colors disabled:opacity-50">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          Download PDF
        </button>
        <button id="refreshBtn" class="inline-flex items-center gap-2 px-3 py-2.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-semibold rounded-lg shadow-sm transition-colors">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200" id="reportsTable">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Date</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Executive</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Office</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Customer / Institution</th>
              <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Category</th>
              <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Est. Revenue</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200 text-sm" id="tableBody">
            <tr>
              <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-3 text-gray-400"></i>
                Connecting to database...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
